name: Build and deploy Warzone 2100 Web Edition

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site shell
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Download official Warzone 2100 Web Edition
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/Warzone2100/warzone2100/releases/download/4.7.0/warzone2100_web_wasm32_archive.zip" \
            --output /tmp/warzone-web.zip
          mkdir -p /tmp/warzone-web site/game
          unzip -q /tmp/warzone-web.zip -d /tmp/warzone-web
          game_index="$(find /tmp/warzone-web -type f -name index.html -print -quit)"
          if [ -z "$game_index" ]; then
            echo "Could not find index.html in the official Web Edition archive"
            exit 1
          fi
          game_root="$(dirname "$game_index")"
          cp -a "$game_root"/. site/game/
          test -s site/game/index.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path("site/game/index.html")
          html = p.read_text(encoding="utf-8")
          mobile_css = """
          <style id="mobile-landscape-support">
            @media (orientation: landscape) and (max-height: 520px) {
              html, body {
                width: 100% !important;
                height: 100% !important;
                min-width: 0 !important;
                min-height: 0 !important;
                margin: 0 !important;
                overflow: hidden !important;
              }
              .small-screen-blocker { display: none !important; }
              #emscripten_container {
                position: fixed !important;
                inset: 0 !important;
                width: 100vw !important;
                height: 100dvh !important;
                overflow: hidden !important;
              }
              canvas.emscripten {
                width: 100vw !important;
                height: 100dvh !important;
                max-width: 100vw !important;
                max-height: 100dvh !important;
              }
            }
          </style>
          """
          if 'id="mobile-landscape-support"' not in html:
              if "</head>" not in html:
                  raise SystemExit("Cannot patch Web Edition: </head> not found")
              html = html.replace("</head>", mobile_css + "\\n</head>", 1)
              p.write_text(html, encoding="utf-8")
          if 'id="mobile-landscape-support"' not in p.read_text(encoding="utf-8"):
              raise SystemExit("Mobile landscape patch verification failed")
          print("Added landscape phone support to the Web Edition shell")
          PY

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p site
          cp index.html site/index.html
          if [ -d assets ]; then cp -a assets site/; fi
          touch site/.nojekyll

      - name: Verify published files
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/game/index.html
          echo "Root page: $(wc -c < site/index.html) bytes"
          echo "Game page: $(wc -c < site/game/index.html) bytes"
          find site/game -maxdepth 2 -type f | sort | head -40

      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
