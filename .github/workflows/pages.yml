name: Build and deploy Warzone 2100 Web Edition

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site shell
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Checkout pinned Warzone source
        uses: actions/checkout@v4
        with:
          repository: Warzone2100/warzone2100
          ref: 4.7.0
          path: src
          submodules: recursive

      - name: Apply minimap alert source change
        run: |
          set -euo pipefail
          python3 patches/apply-minimap-enemy-alerts.py

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake git zip unzip gettext asciidoctor autoconf autoconf-archive automake libtool

      - uses: actions/setup-node@v4
        with:
          package-manager-cache: false

      - name: Install EMSDK
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install 4.0.10
          ./emsdk activate 4.0.10
          echo "CI_EMSDK_ENV_SCRIPT_PATH=$(pwd)/emsdk_env.sh" >> "$GITHUB_ENV"

      - name: Configure custom WebAssembly build
        working-directory: src
        run: |
          set -euo pipefail
          mkdir -p ../build ../installed
          git clone https://github.com/microsoft/vcpkg.git ../build/vcpkg
          source "$CI_EMSDK_ENV_SCRIPT_PATH"
          cmake -S . -B ../build \
            -DCMAKE_BUILD_TYPE=Release \
            -DWZ_ENABLE_WARNINGS:BOOL=ON \
            -DWZ_DISTRIBUTOR:STRING="custom-minimap-alerts" \
            "-DCMAKE_TOOLCHAIN_FILE=../build/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            "-DVCPKG_TARGET_TRIPLET=wasm32-emscripten" \
            "-DCMAKE_INSTALL_PREFIX:PATH=$GITHUB_WORKSPACE/installed"

      - name: Build custom WebAssembly game
        working-directory: src
        run: |
          set -euo pipefail
          source "$CI_EMSDK_ENV_SCRIPT_PATH"
          cmake --build ../build --config Release --target install --parallel 4
          cd ../build
          cpack --config ./CPackConfig.cmake -G ZIP \
            -D CPACK_PACKAGE_FILE_NAME="warzone2100_archive" \
            -D CPACK_INCLUDE_TOPLEVEL_DIRECTORY=OFF \
            -D CPACK_ARCHIVE_COMPONENT_INSTALL=ON \
            -D CPACK_COMPONENTS_GROUPING=ALL_COMPONENTS_IN_ONE
          mkdir -p /tmp/warzone-web
          unzip -q ./warzone2100_archive.zip -d /tmp/warzone-web
      - name: Prepare game files
        run: |
          set -euo pipefail
          game_index="$(find /tmp/warzone-web -type f -name index.html -print -quit)"
          if [ -z "$game_index" ]; then
            echo "Custom WebAssembly archive has no index.html"
            find /tmp/warzone-web -maxdepth 3 -type f | head -80
            exit 1
          fi
          cp -a "$(dirname "$game_index")"/. site/game/
          test -s site/game/index.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path("site/game/index.html")
          html = p.read_text(encoding="utf-8")
          mobile_css = """
          <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
          <style id="mobile-landscape-support">
            html, body {
              max-width: 100% !important;
              margin: 0 !important;
            }
            .small-screen-blocker { display: none !important; }
            /* Center the existing game canvas without changing its game resolution. */
            #emscripten_container {
              display: grid !important;
              place-items: center !important;
              margin-left: auto !important;
              margin-right: auto !important;
            }
            canvas.emscripten {
              display: block !important;
              margin-left: auto !important;
              margin-right: auto !important;
              max-width: 100vw !important;
              max-height: 100vh !important;
            }
            @media (orientation: landscape) {
              html, body {
                width: 100vw !important;
                height: 100vh !important;
                min-width: 0 !important;
                min-height: 0 !important;
                overflow: hidden !important;
              }
              #emscripten_container {
                position: fixed !important;
                inset: 0 !important;
                width: 100vw !important;
                height: 100vh !important;
                overflow: hidden !important;
              }
              canvas.emscripten {
                width: 100vw !important;
                height: 100vh !important;
                max-width: 100vw !important;
                max-height: 100vh !important;
              }
            }
          </style>
          """
          if 'id="mobile-landscape-support"' in html:
              start = html.index('<style id="mobile-landscape-support">')
              end = html.index('</style>', start) + len('</style>')
              html = html[:start] + mobile_css[mobile_css.index('<style'):mobile_css.index('</style>') + len('</style>')] + html[end:]
          else:
              if "</head>" not in html:
                  raise SystemExit("Cannot patch Web Edition: </head> not found")
              html = html.replace("</head>", mobile_css + "\n</head>", 1)
          touch_script = """
          <script id="mobile-touch-pan">
          (() => {
            const install = () => {
              const canvas = document.querySelector("canvas.emscripten");
              if (!canvas || canvas.dataset.touchPanInstalled) return;
              canvas.dataset.touchPanInstalled = "1";
              canvas.style.touchAction = "none";
              let touch = null, pendingTap = null, lastTap = null, pinch = null;
              const DOUBLE_MS = 200, MOVE_LIMIT = 10;
              // Safari may synthesize trusted mouse events after a long touch.
              // Block those native compatibility events; this script emits its own
              // deliberate MouseEvents for taps and second-tap drag selection.
              let lastTouchAt = 0;
              for (const type of ["mousedown", "mouseup", "mousemove", "click", "dblclick"]) {
                document.addEventListener(type, event => {
                  if (event.isTrusted && Date.now() - lastTouchAt < 1200) {
                    event.preventDefault();
                    event.stopImmediatePropagation();
                  }
                }, true);
              }
              const sendKey = (type, key) => {
                if (!key) return;
                const target = document.activeElement || canvas;
                target.dispatchEvent(new KeyboardEvent(type, { key, code: key, bubbles: true, cancelable: true }));
                document.dispatchEvent(new KeyboardEvent(type, { key, code: key, bubbles: true, cancelable: true }));
              };
              const sendMouse = (type, x, y, detail = 1) => canvas.dispatchEvent(new MouseEvent(type, {
                bubbles: true, cancelable: true, view: window, button: 0, detail,
                buttons: type === "mouseup" || type === "click" || type === "dblclick" ? 0 : 1,
                clientX: x, clientY: y
              }));
              const clickAt = (x, y) => {
                sendMouse("mousedown", x, y);
                sendMouse("mouseup", x, y);
                sendMouse("click", x, y);
              };
              const stopKey = () => {
                if (touch && touch.key) sendKey("keyup", touch.key);
                if (touch) touch.key = null;
              };
              const keyFor = (dx, dy) => {
                if (Math.max(Math.abs(dx), Math.abs(dy)) < 2) return null;
                if (Math.abs(dx) >= Math.abs(dy)) return dx > 0 ? "ArrowLeft" : "ArrowRight";
                return dy > 0 ? "ArrowUp" : "ArrowDown";
              };
              const clearPendingTap = () => {
                if (pendingTap) clearTimeout(pendingTap.timer);
                pendingTap = null;
              };
              const finishTouch = (x, y) => {
                if (!touch) return;
                if (touch.mode === "pan") {
                  stopKey();
                } else if (touch.mode === "tap") {
                  const point = { x: touch.startX, y: touch.startY };
                  clearPendingTap();
                  pendingTap = { point, timer: setTimeout(() => {
                    clickAt(point.x, point.y);
                    pendingTap = null;
                  }, DOUBLE_MS) };
                } else if (touch.mode === "doubleCandidate" && !touch.moved) {
                  // A stationary double-tap becomes a real double-click for the game
                  // (e.g. inspect a unit); it never becomes a map-move command.
                  const point = { x: touch.startX, y: touch.startY };
                  // Replay a browser-style double click so Emscripten/SDL can
                  // recognize the engine's native double-click gesture on a unit.
                  // Warzone's native double-click handler targets the object under
                  // the pointer; a double tap on empty terrain must not create a move order.
                  sendMouse("mousedown", point.x, point.y, 1);
                  sendMouse("mouseup", point.x, point.y, 1);
                  sendMouse("click", point.x, point.y, 1);
                  sendMouse("mousedown", point.x, point.y, 2);
                  sendMouse("mouseup", point.x, point.y, 2);
                  sendMouse("click", point.x, point.y, 2);
                  sendMouse("dblclick", point.x, point.y, 2);
                }
                if (touch.holdTimer) clearTimeout(touch.holdTimer);
                touch = null;
              };
              canvas.addEventListener("touchstart", event => {
                if (event.touches.length === 2) {
                  stopKey();
                  if (touch && touch.holdTimer) clearTimeout(touch.holdTimer);
                  touch = null;
                  clearPendingTap();
                  const a = event.touches[0], b = event.touches[1];
                  pinch = {
                    distance: Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY),
                    x: (a.clientX + b.clientX) / 2,
                    y: (a.clientY + b.clientY) / 2
                  };
                  lastTouchAt = Date.now();
                  event.preventDefault();
                  return;
                }
                if (event.touches.length !== 1) {
                  /* Ignore unsupported multi-touch gestures. */
                  pinch = null;
                  stopKey();
                  if (touch && touch.holdTimer) clearTimeout(touch.holdTimer);
                  touch = null;
                  event.preventDefault();
                  return;
                }
                pinch = null;
                const t = event.touches[0], now = Date.now();
                lastTouchAt = now;
                const isDouble = !!(lastTap && now - lastTap.time <= DOUBLE_MS &&
                  Math.hypot(t.clientX - lastTap.x, t.clientY - lastTap.y) <= 36);
                canvas.focus({ preventScroll: true });
                touch = {
                  startX: t.clientX, startY: t.clientY, x: t.clientX, y: t.clientY,
                  mode: isDouble ? "doubleCandidate" : "pending", moved: false, key: null, holdTimer: null
                };
                if (isDouble) {
                  lastTap = null;
                  clearPendingTap();
                  // Double-tap then drag pans the map instead of drawing a selection box.
                } else {
                  lastTap = { x: t.clientX, y: t.clientY, time: now };
                  // A single touch never pans the map, even if held or dragged.
                }
                event.preventDefault();
              }, { passive: false, capture: true });
              canvas.addEventListener("touchmove", event => {
                if (event.touches.length === 2) {
                  const a = event.touches[0], b = event.touches[1];
                  const distance = Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY);
                  const x = (a.clientX + b.clientX) / 2;
                  const y = (a.clientY + b.clientY) / 2;
                  if (pinch && Math.abs(distance - pinch.distance) >= 1.5) {
                    /* Translate finger spreading/pinching into the wheel event SDL uses for zoom. */
                    canvas.dispatchEvent(new WheelEvent("wheel", {
                      bubbles: true, cancelable: true,
                      deltaY: pinch.distance - distance,
                      clientX: x, clientY: y
                    }));
                    pinch.distance = distance;
                    pinch.x = x;
                    pinch.y = y;
                  }
                  event.preventDefault();
                  return;
                }
                if (!touch || event.touches.length !== 1) return;
                const t = event.touches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y;
                if (Math.hypot(t.clientX - touch.startX, t.clientY - touch.startY) > MOVE_LIMIT) {
                  touch.moved = true;
                  if (touch.holdTimer) { clearTimeout(touch.holdTimer); touch.holdTimer = null; }
                  // The second tap only pans if the finger is dragged; a stationary
                  // double-tap is reserved for inspecting a unit.
                  if (touch.mode === "doubleCandidate") touch.mode = "pan";
                }
                if (touch.mode === "pan" && touch.moved) {
                  const nextKey = keyFor(dx, dy);
                  if (nextKey && nextKey !== touch.key) {
                    stopKey();
                    touch.key = nextKey;
                    sendKey("keydown", nextKey);
                  }
                }
                touch.x = t.clientX; touch.y = t.clientY;
                event.preventDefault();
              }, { passive: false, capture: true });
              canvas.addEventListener("touchend", event => {
                if (event.touches.length < 2) pinch = null;
                if (!touch) { event.preventDefault(); return; }
                const t = event.changedTouches[0];
                if (touch && touch.mode === "pending" && !touch.moved) touch.mode = "tap";
                finishTouch(t ? t.clientX : (touch && touch.x), t ? t.clientY : (touch && touch.y));
                event.preventDefault();
              }, { passive: false, capture: true });
              canvas.addEventListener("touchcancel", event => {
                stopKey();
                if (touch && touch.holdTimer) clearTimeout(touch.holdTimer);
                touch = null;
                event.preventDefault();
              }, { passive: false, capture: true });
            };
            if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", install, { once: true });
            else install();
            new MutationObserver(install).observe(document.documentElement, { childList: true, subtree: true });
          })();
          </script>
          """
          if 'id="mobile-touch-pan"' not in html:
              if "</body>" not in html:
                  raise SystemExit("Cannot patch Web Edition: </body> not found")
              html = html.replace("</body>", touch_script + "\\n</body>", 1)
          # Persist game-generated savegames/config while the tab is still active.
          # The official Web Edition exposes IDBFS syncing, but JS cannot serialize
          # the live simulation itself; the engine must first write a savegame.
          persistence_script = """
          <script id="warzone-periodic-persistence">
          (() => {
            let lastSync = 0;
            let syncInProgress = false;
            const sync = (force = false) => {
              const module = (typeof LaunchedModule !== "undefined" && LaunchedModule) ||
                             (typeof Module !== "undefined" && Module);
              if (!module || typeof module.wzSaveConfigDirToPersistentStore !== "function") return;
              const now = Date.now();
              if (syncInProgress || (!force && now - lastSync < 4000)) return;
              syncInProgress = true;
              lastSync = now;
              try {
                module.wzSaveConfigDirToPersistentStore(() => { syncInProgress = false; });
              } catch (error) {
                syncInProgress = false;
                console.warn("Warzone persistent save sync failed", error);
              }
            };
            window.setInterval(() => sync(false), 5000);
            document.addEventListener("visibilitychange", () => {
              if (document.visibilityState === "hidden") sync(true);
            });
            window.addEventListener("pagehide", () => sync(true));
            window.addEventListener("beforeunload", () => sync(true));
          })();
          </script>
          """
          if 'id="warzone-periodic-persistence"' not in html:
              if "</body>" not in html:
                  raise SystemExit("Cannot add persistent-save hook: </body> not found")
              html = html.replace("</body>", persistence_script + "\\n</body>", 1)
          p.write_text(html, encoding="utf-8")
          check = p.read_text(encoding="utf-8")
          if 'id="mobile-landscape-support"' not in check or ".small-screen-blocker" not in check:
              raise SystemExit("Mobile viewport patch verification failed")
          print("Added centered, no-scroll phone layout for portrait and landscape")
          PY

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p site
          cp index.html site/index.html
          if [ -f diagnostic.html ]; then
            cp diagnostic.html site/diagnostic.html
            cp diagnostic.html site/game/diagnostic.html
          fi
          if [ -d assets ]; then cp -a assets site/; fi
          touch site/.nojekyll

      - name: Add cross-origin isolation support for WebAssembly threads
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/gzuidhof/coi-serviceworker/master/coi-serviceworker.min.js" \
            --output site/coi-serviceworker.min.js
          test -s site/coi-serviceworker.min.js
          cp site/coi-serviceworker.min.js site/game/coi-serviceworker.min.js
          test -s site/game/coi-serviceworker.min.js
          # The upstream game registers its own service-worker.js at /game/,
          # which overrides cross-origin isolation. Keep the same scope but use
          # the COI worker implementation there so WebAssembly threads can run.
          if [ -f site/game/service-worker.js ]; then
            cp site/game/coi-serviceworker.min.js site/game/service-worker.js
          fi
          python3 - <<'PY'
          from pathlib import Path
          targets = [
              (Path("site/index.html"), "./coi-serviceworker.min.js"),
              (Path("site/game/index.html"), "./coi-serviceworker.min.js"),
          ]
          for path, src in targets:
              html = path.read_text(encoding="utf-8")
              marker = 'src="' + src + '"'
              if marker not in html:
                  script = '<script src="' + src + '"></script>' + chr(10)
                  if "</head>" not in html:
                      raise SystemExit(f"Cannot inject service worker helper into {path}: no </head>")
                  html = html.replace("<head>", "<head>\n" + script, 1)
                  path.write_text(html, encoding="utf-8")
              if marker not in path.read_text(encoding="utf-8"):
                  raise SystemExit(f"Service worker helper verification failed for {path}")
          print("Added cross-origin isolation helper to site and game pages")
          PY

      - name: Verify published files
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/game/index.html
          echo "Root page: $(wc -c < site/index.html) bytes"
          echo "Game page: $(wc -c < site/game/index.html) bytes"
          test -s site/game/coi-serviceworker.min.js
          echo "Game-scoped isolation helper: present"
          find site/game -maxdepth 2 -type f | sort | head -40

      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
