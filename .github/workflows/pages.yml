name: Build and deploy Warzone 2100 Web Edition

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site shell
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Download official Warzone 2100 Web Edition
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/Warzone2100/warzone2100/releases/download/4.7.0/warzone2100_web_wasm32_archive.zip" \
            --output /tmp/warzone-web.zip
          mkdir -p /tmp/warzone-web site/game
          unzip -q /tmp/warzone-web.zip -d /tmp/warzone-web
          game_index="$(find /tmp/warzone-web -type f -name index.html -print -quit)"
          if [ -z "$game_index" ]; then
            echo "Could not find index.html in the official Web Edition archive"
            exit 1
          fi
          game_root="$(dirname "$game_index")"
          cp -a "$game_root"/. site/game/
          test -s site/game/index.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path("site/game/index.html")
          html = p.read_text(encoding="utf-8")
          mobile_css = """
          <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
          <style id="mobile-landscape-support">
            html, body {
              max-width: 100% !important;
              margin: 0 !important;
            }
            .small-screen-blocker { display: none !important; }
            /* Center the existing game canvas without changing its game resolution. */
            #emscripten_container {
              display: grid !important;
              place-items: center !important;
              margin-left: auto !important;
              margin-right: auto !important;
            }
            canvas.emscripten {
              display: block !important;
              margin-left: auto !important;
              margin-right: auto !important;
              max-width: 100vw !important;
              max-height: 100vh !important;
            }
            @media (orientation: landscape) {
              html, body {
                width: 100vw !important;
                height: 100vh !important;
                min-width: 0 !important;
                min-height: 0 !important;
                overflow: hidden !important;
              }
              #emscripten_container {
                position: fixed !important;
                inset: 0 !important;
                width: 100vw !important;
                height: 100vh !important;
                overflow: hidden !important;
              }
              canvas.emscripten {
                width: 100vw !important;
                height: 100vh !important;
                max-width: 100vw !important;
                max-height: 100vh !important;
              }
            }
          </style>
          """
          if 'id="mobile-landscape-support"' in html:
              start = html.index('<style id="mobile-landscape-support">')
              end = html.index('</style>', start) + len('</style>')
              html = html[:start] + mobile_css[mobile_css.index('<style'):mobile_css.index('</style>') + len('</style>')] + html[end:]
          else:
              if "</head>" not in html:
                  raise SystemExit("Cannot patch Web Edition: </head> not found")
              html = html.replace("</head>", mobile_css + "\n</head>", 1)
          touch_script = """
          <script id="mobile-touch-pan">
          (() => {
            const install = () => {
              const canvas = document.querySelector("canvas.emscripten");
              if (!canvas || canvas.dataset.touchPanInstalled) return;
              canvas.dataset.touchPanInstalled = "1";
              canvas.style.touchAction = "none";
              let touch = null, pendingTap = null, lastTap = null;
              const DOUBLE_MS = 330, MOVE_LIMIT = 10, HOLD_MS = 320;
              const sendKey = (type, key) => {
                if (!key) return;
                const target = document.activeElement || canvas;
                target.dispatchEvent(new KeyboardEvent(type, { key, code: key, bubbles: true, cancelable: true }));
                document.dispatchEvent(new KeyboardEvent(type, { key, code: key, bubbles: true, cancelable: true }));
              };
              const sendMouse = (type, x, y) => canvas.dispatchEvent(new MouseEvent(type, {
                bubbles: true, cancelable: true, view: window, button: 0,
                buttons: type === "mouseup" || type === "click" ? 0 : 1,
                clientX: x, clientY: y
              }));
              const clickAt = (x, y) => {
                sendMouse("mousedown", x, y);
                sendMouse("mouseup", x, y);
                sendMouse("click", x, y);
              };
              const stopKey = () => {
                if (touch && touch.key) sendKey("keyup", touch.key);
                if (touch) touch.key = null;
              };
              const keyFor = (dx, dy) => {
                if (Math.max(Math.abs(dx), Math.abs(dy)) < 2) return null;
                if (Math.abs(dx) >= Math.abs(dy)) return dx > 0 ? "ArrowLeft" : "ArrowRight";
                return dy > 0 ? "ArrowUp" : "ArrowDown";
              };
              const clearPendingTap = () => {
                if (pendingTap) clearTimeout(pendingTap.timer);
                pendingTap = null;
              };
              const finishTouch = (x, y) => {
                if (!touch) return;
                if (touch.mode === "box") {
                  sendMouse("mouseup", x, y);
                  // A stationary second tap should behave as a regular single-unit click.
                  if (!touch.moved) sendMouse("click", x, y);
                } else if (touch.mode === "pan") {
                  stopKey();
                } else if (touch.mode === "tap") {
                  const point = { x: touch.startX, y: touch.startY };
                  clearPendingTap();
                  pendingTap = { point, timer: setTimeout(() => {
                    clickAt(point.x, point.y);
                    pendingTap = null;
                  }, DOUBLE_MS) };
                }
                if (touch.holdTimer) clearTimeout(touch.holdTimer);
                touch = null;
              };
              canvas.addEventListener("touchstart", event => {
                if (event.touches.length !== 1) {
                  if (touch && touch.mode === "box") sendMouse("mouseup", touch.x, touch.y);
                  stopKey();
                  if (touch && touch.holdTimer) clearTimeout(touch.holdTimer);
                  touch = null;
                  event.preventDefault();
                  return;
                }
                const t = event.touches[0], now = Date.now();
                const isDouble = !!(lastTap && now - lastTap.time <= DOUBLE_MS &&
                  Math.hypot(t.clientX - lastTap.x, t.clientY - lastTap.y) <= 36);
                canvas.focus({ preventScroll: true });
                touch = {
                  startX: t.clientX, startY: t.clientY, x: t.clientX, y: t.clientY,
                  mode: isDouble ? "box" : "pending", moved: false, key: null, holdTimer: null
                };
                if (isDouble) {
                  lastTap = null;
                  clearPendingTap();
                  // Begin a drag-selection only on the second tap; one tap never starts a box.
                  sendMouse("mousedown", t.clientX, t.clientY);
                } else {
                  lastTap = { x: t.clientX, y: t.clientY, time: now };
                  touch.holdTimer = setTimeout(() => {
                    if (!touch || touch.mode !== "pending" || touch.moved) return;
                    clearPendingTap();
                    touch.mode = "pan";
                  }, HOLD_MS);
                }
                event.preventDefault();
              }, { passive: false, capture: true });
              canvas.addEventListener("touchmove", event => {
                if (!touch || event.touches.length !== 1) return;
                const t = event.touches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y;
                if (Math.hypot(t.clientX - touch.startX, t.clientY - touch.startY) > MOVE_LIMIT) {
                  touch.moved = true;
                  if (touch.holdTimer) { clearTimeout(touch.holdTimer); touch.holdTimer = null; }
                  if (touch.mode === "pending") touch.mode = "pan";
                }
                if (touch.mode === "box") {
                  sendMouse("mousemove", t.clientX, t.clientY);
                } else if (touch.mode === "pan" && touch.moved) {
                  const nextKey = keyFor(dx, dy);
                  if (nextKey && nextKey !== touch.key) {
                    stopKey();
                    touch.key = nextKey;
                    sendKey("keydown", nextKey);
                  }
                }
                touch.x = t.clientX; touch.y = t.clientY;
                event.preventDefault();
              }, { passive: false, capture: true });
              canvas.addEventListener("touchend", event => {
                const t = event.changedTouches[0];
                if (touch && touch.mode === "pending" && !touch.moved) touch.mode = "tap";
                finishTouch(t ? t.clientX : (touch && touch.x), t ? t.clientY : (touch && touch.y));
                event.preventDefault();
              }, { passive: false, capture: true });
              canvas.addEventListener("touchcancel", event => {
                if (touch && touch.mode === "box") sendMouse("mouseup", touch.x, touch.y);
                stopKey();
                if (touch && touch.holdTimer) clearTimeout(touch.holdTimer);
                touch = null;
                event.preventDefault();
              }, { passive: false, capture: true });
            };
            if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", install, { once: true });
            else install();
            new MutationObserver(install).observe(document.documentElement, { childList: true, subtree: true });
          })();
          </script>
          """
          if 'id="mobile-touch-pan"' not in html:
              if "</body>" not in html:
                  raise SystemExit("Cannot patch Web Edition: </body> not found")
              html = html.replace("</body>", touch_script + "\\n</body>", 1)
          p.write_text(html, encoding="utf-8")
          check = p.read_text(encoding="utf-8")
          if 'id="mobile-landscape-support"' not in check or ".small-screen-blocker" not in check:
              raise SystemExit("Mobile viewport patch verification failed")
          print("Added centered, no-scroll phone layout for portrait and landscape")
          PY

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p site
          cp index.html site/index.html
          if [ -f diagnostic.html ]; then
            cp diagnostic.html site/diagnostic.html
            cp diagnostic.html site/game/diagnostic.html
          fi
          if [ -d assets ]; then cp -a assets site/; fi
          touch site/.nojekyll

      - name: Add cross-origin isolation support for WebAssembly threads
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/gzuidhof/coi-serviceworker/master/coi-serviceworker.min.js" \
            --output site/coi-serviceworker.min.js
          test -s site/coi-serviceworker.min.js
          cp site/coi-serviceworker.min.js site/game/coi-serviceworker.min.js
          test -s site/game/coi-serviceworker.min.js
          # The upstream game registers its own service-worker.js at /game/,
          # which overrides cross-origin isolation. Keep the same scope but use
          # the COI worker implementation there so WebAssembly threads can run.
          if [ -f site/game/service-worker.js ]; then
            cp site/game/coi-serviceworker.min.js site/game/service-worker.js
          fi
          python3 - <<'PY'
          from pathlib import Path
          targets = [
              (Path("site/index.html"), "./coi-serviceworker.min.js"),
              (Path("site/game/index.html"), "./coi-serviceworker.min.js"),
          ]
          for path, src in targets:
              html = path.read_text(encoding="utf-8")
              marker = 'src="' + src + '"'
              if marker not in html:
                  script = '<script src="' + src + '"></script>' + chr(10)
                  if "</head>" not in html:
                      raise SystemExit(f"Cannot inject service worker helper into {path}: no </head>")
                  html = html.replace("<head>", "<head>\n" + script, 1)
                  path.write_text(html, encoding="utf-8")
              if marker not in path.read_text(encoding="utf-8"):
                  raise SystemExit(f"Service worker helper verification failed for {path}")
          print("Added cross-origin isolation helper to site and game pages")
          PY

      - name: Verify published files
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/game/index.html
          echo "Root page: $(wc -c < site/index.html) bytes"
          echo "Game page: $(wc -c < site/game/index.html) bytes"
          test -s site/game/coi-serviceworker.min.js
          echo "Game-scoped isolation helper: present"
          find site/game -maxdepth 2 -type f | sort | head -40

      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
