name: Validate experimental mobile layout

on:
  push:
    branches:
      - "experiment/centered-canvas-2026-10-21"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4

      - name: Check stylesheet and workflow patch
        shell: bash
        run: |
          set -euo pipefail
          test -s warzone-mobile-layout.css
          grep -q 'orientation: portrait' warzone-mobile-layout.css
          grep -q 'orientation: landscape' warzone-mobile-layout.css
          grep -q 'object-fit: contain' warzone-mobile-layout.css
          grep -q 'warzone-mobile-layout.css' .github/workflows/pages.yml
          python3 - <<'PY'
          from pathlib import Path
          css = Path("warzone-mobile-layout.css").read_text()
          workflow = Path(".github/workflows/pages.yml").read_text()
          assert "place-items: center" in css
          assert "max-width: 100vw" in css
          assert "max-height: 100dvh" in css
          assert 'html = html.replace("</head>", stylesheet + "\\n" + "</head>", 1)' in workflow
          print("Stylesheet and HTML injection checks passed")
          PY

      - name: Download official game and test HTML injection
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/Warzone2100/warzone2100/releases/download/4.7.0/warzone2100_web_wasm32_archive.zip" \
            --output /tmp/warzone-web.zip
          mkdir -p /tmp/warzone-web site/game
          unzip -q /tmp/warzone-web.zip -d /tmp/warzone-web
          game_index="$(find /tmp/warzone-web -type f -name index.html -print -quit)"
          test -n "$game_index"
          cp -a "$(dirname "$game_index")/." site/game/
          cp warzone-mobile-layout.css site/game/warzone-mobile-layout.css
          python3 - <<'PY'
          from pathlib import Path
          p = Path("site/game/index.html")
          html = p.read_text(encoding="utf-8")
          viewport = '<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover>'
          stylesheet = '<link rel="stylesheet" href="./warzone-mobile-layout.css">'
          if "</head>" not in html:
              raise SystemExit("No </head> in upstream game page")
          if 'name="viewport"' not in html:
              html = html.replace("</head>", viewport + "\\n" + "</head>", 1)
          if stylesheet not in html:
              html = html.replace("</head>", stylesheet + "\\n" + "</head>", 1)
          p.write_text(html, encoding="utf-8")
          final = p.read_text(encoding="utf-8")
          assert stylesheet in final
          assert Path("site/game/warzone-mobile-layout.css").is_file()
          print("Official game HTML injection passed")
          PY
